name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        shell: bash
        run: |
          if [ -f OfflineChat-Project[4].zip ]; then f=OfflineChat-Project[4].zip; else f=$(ls *.zip 2>/dev/null | head -1); fi
          if [ -z "$f" ]; then
            echo '## Repository me koi .zip file nahi mili. Repository ki files:' >> $GITHUB_STEP_SUMMARY
            ls -la >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "Using zip: $f"
          unzip -o "$f" -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: proj
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo '## ERRORS (ye mujhe bhejo)' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E '^e: |What went wrong|error:|Execution failed' -A2 build.log | head -60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineChat-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
