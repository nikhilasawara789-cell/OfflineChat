name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o "OfflineChat-Project (1).zip" -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: |
          DIR=$(dirname "$(find proj -name 'settings.gradle*' | head -n 1)")
          cd "$DIR"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineChat-APK
          path: proj/**/build/outputs/apk/debug/*.apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
